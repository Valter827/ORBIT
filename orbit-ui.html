<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ORBIT — Personal AI Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#07080C;
    --panel:#0D0F16;
    --raised:#141824;
    --line:rgba(255,255,255,.07);
    --line-strong:rgba(255,255,255,.13);
    --ink:#E9EBF2;
    --ink-dim:#9AA1B5;
    --ink-faint:#646B80;
    --blue:#4D7CFE;
    --violet:#8B5CF6;
    --ok:#3DD68C;
    --warn:#F0B429;
    --bad:#F2545B;
    --r:10px;
    --ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --display:"Inter Tight","Inter",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:var(--ui);
    font-size:14px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  /* aurora wash, deliberately low-contrast so panels stay readable */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(760px 420px at 18% -10%, rgba(77,124,254,.16), transparent 62%),
      radial-gradient(620px 460px at 92% 8%, rgba(139,92,246,.13), transparent 60%);
  }
  .shell{position:relative;z-index:1;display:grid;grid-template-columns:216px 1fr;min-height:100vh;max-width:1320px;margin:0 auto}

  /* ── rail ───────────────────────────────────────────── */
  .rail{border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:26px;background:linear-gradient(180deg,rgba(13,15,22,.82),rgba(7,8,12,.6))}
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .wordmark{font-family:var(--display);font-size:16px;letter-spacing:.24em;font-weight:500}
  nav{display:flex;flex-direction:column;gap:1px}
  .navitem{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;color:var(--ink-dim);cursor:pointer;border:1px solid transparent;font-size:13.5px;transition:background .14s,color .14s}
  .navitem:hover{background:rgba(255,255,255,.035);color:var(--ink)}
  .navitem[aria-current="true"]{background:rgba(77,124,254,.11);border-color:rgba(77,124,254,.26);color:var(--ink)}
  .navitem svg{flex:none;opacity:.85}
  .rail-foot{margin-top:auto;padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-faint)}
  .perm-row{display:flex;justify-content:space-between;padding:3px 0}
  .perm-row b{font-weight:450;color:var(--ink-dim)}

  /* ── top bar ────────────────────────────────────────── */
  .stage{display:flex;flex-direction:column;min-width:0}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 26px;border-bottom:1px solid var(--line)}
  .crumb{font-size:13px;color:var(--ink-faint)}
  .crumb b{color:var(--ink-dim);font-weight:450}
  .badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line-strong);border-radius:999px;font-size:11.5px;color:var(--ink-dim);background:rgba(255,255,255,.02)}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(61,214,140,.16)}
  .dot.off{background:var(--ink-faint);box-shadow:none}
  .pill.proto{border-color:rgba(240,180,41,.35);color:#E8C77A;background:rgba(240,180,41,.07)}

  main{padding:40px 26px 60px;flex:1}
  .hero{max-width:640px}
  h1{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.2;margin:0 0 2px;letter-spacing:-.01em}
  .hero p{margin:0 0 22px;color:var(--ink-faint);font-size:15px}

  .ask{width:100%;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:12px;background:rgba(20,24,36,.7);border:1px solid var(--line-strong);cursor:text;text-align:left;color:var(--ink-faint);font:inherit;backdrop-filter:blur(14px);transition:border-color .15s,background .15s}
  .ask:hover,.ask:focus-visible{border-color:rgba(77,124,254,.45);background:rgba(23,28,42,.8)}
  .ask kbd{margin-left:auto}
  kbd{font-family:var(--mono);font-size:11px;padding:2px 6px;border:1px solid var(--line-strong);border-radius:5px;color:var(--ink-faint);background:rgba(255,255,255,.03)}

  .section-head{display:flex;align-items:baseline;justify-content:space-between;margin:38px 0 12px}
  .section-head h2{font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--ink-faint);margin:0;text-transform:uppercase}
  .section-head span{font-size:12px;color:var(--ink-faint)}

  .ctx{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
  .card{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:rgba(13,15,22,.66);backdrop-filter:blur(10px)}
  .card h3{margin:0 0 3px;font-size:13.5px;font-weight:500}
  .card .meta{font-size:12.5px;color:var(--ink-faint)}
  .card .tag{margin-top:10px;font-family:var(--mono);font-size:11px;color:var(--ink-dim)}
  .card.live{border-color:rgba(77,124,254,.28)}
  .headline{display:flex;align-items:center;gap:8px}

  /* ── agent surface ──────────────────────────────────── */
  .agent{margin-top:34px;max-width:720px}
  .plan{border:1px solid rgba(77,124,254,.3);border-radius:12px;overflow:hidden;background:rgba(15,19,30,.8)}
  .plan-head{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  .plan-head .k{font-size:11.5px;letter-spacing:.14em;color:var(--blue);font-family:var(--display)}
  .plan-head h3{margin:4px 0 0;font-size:16px;font-weight:500;font-family:var(--display)}
  ol.steps{margin:0;padding:14px 18px 14px 38px;color:var(--ink-dim);font-size:13.5px}
  ol.steps li{padding:2px 0}
  .plan-foot{display:flex;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line);align-items:center}
  .note{font-size:12px;color:var(--ink-faint);margin-left:auto}

  button{font:inherit}
  .btn{padding:8px 15px;border-radius:8px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:var(--ink);cursor:pointer;font-size:13px;transition:background .14s,border-color .14s}
  .btn:hover{background:rgba(255,255,255,.08)}
  .btn.primary{background:linear-gradient(135deg,var(--blue),var(--violet));border-color:transparent;color:#fff;font-weight:500}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.danger{border-color:rgba(242,84,91,.4);color:#FF9B9F}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  .timeline{border:1px solid var(--line);border-radius:12px;background:rgba(13,15,22,.7);padding:6px 18px 16px}
  .tl-row{display:grid;grid-template-columns:20px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04);opacity:0;transform:translateY(4px);transition:opacity .28s ease,transform .28s ease}
  .tl-row.in{opacity:1;transform:none}
  .tl-row:last-child{border-bottom:0}
  .tl-row .mark{font-size:13px;line-height:1.6;text-align:center}
  .tl-row .label{font-size:13.5px}
  .tl-row .sub{font-family:var(--mono);font-size:11.5px;color:var(--ink-faint);margin-top:2px;word-break:break-all}
  .m-ok{color:var(--ok)} .m-run{color:var(--blue)} .m-warn{color:var(--warn)} .m-bad{color:var(--bad)}
  .spin{display:inline-block;animation:sp 1.1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .diff{margin:12px 0 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .diff-head{display:flex;align-items:center;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--ink-dim);background:rgba(255,255,255,.02)}
  pre.code{margin:0;padding:12px 13px;font-family:var(--mono);font-size:12px;line-height:1.7;overflow-x:auto}
  .del{color:#FF9096;background:rgba(242,84,91,.08);display:block}
  .add{color:#86E8B8;background:rgba(61,214,140,.08);display:block}
  .diff-foot{display:flex;gap:8px;padding:10px 13px;border-top:1px solid var(--line)}

  .result{margin-top:14px;border:1px solid rgba(61,214,140,.3);background:rgba(61,214,140,.06);border-radius:10px;padding:14px 16px}
  .result h4{margin:0 0 4px;font-size:14px;font-weight:500}
  .result p{margin:0;color:var(--ink-dim);font-size:13px}

  /* ── overlays ───────────────────────────────────────── */
  .scrim{position:fixed;inset:0;z-index:40;background:rgba(4,5,9,.62);backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;padding:14vh 16px 16px}
  .scrim.open{display:flex}
  .scrim.center{align-items:center;padding:16px}
  .palette{width:min(560px,100%);border:1px solid var(--line-strong);border-radius:14px;background:rgba(16,19,29,.94);overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .palette input{width:100%;padding:16px 18px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:15px}
  .palette input::placeholder{color:var(--ink-faint)}
  .palette input:focus{outline:none}
  .opts{list-style:none;margin:0;padding:6px;max-height:320px;overflow-y:auto}
  .opts li{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px;color:var(--ink-dim)}
  .opts li[aria-selected="true"]{background:rgba(77,124,254,.13);color:var(--ink)}
  .opts li .hint{margin-left:auto;font-size:11.5px;color:var(--ink-faint)}
  .opts .empty{color:var(--ink-faint);justify-content:center;cursor:default}

  .modal{width:min(460px,100%);border:1px solid var(--line-strong);border-radius:14px;background:rgba(16,19,29,.96);padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .modal h3{margin:10px 0 6px;font-size:16px;font-weight:500;font-family:var(--display)}
  .modal p{margin:0 0 4px;color:var(--ink-dim);font-size:13.5px}
  .risk{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;font-size:11.5px;border:1px solid rgba(242,84,91,.4);color:#FF9B9F;background:rgba(242,84,91,.09)}
  .cmd{margin:12px 0;font-family:var(--mono);font-size:12.5px;padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--line);color:#FFC9CC;overflow-x:auto}
  .choices{display:grid;gap:7px;margin-top:16px}
  .choice{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;border-radius:9px;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);cursor:pointer;color:var(--ink);font-size:13.5px;text-align:left}
  .choice:hover{background:rgba(255,255,255,.07)}
  .choice small{color:var(--ink-faint)}
  .choice.no{border-color:rgba(242,84,91,.35);color:#FF9B9F}

  .foot{border-top:1px solid var(--line);padding:16px 26px 26px;color:var(--ink-faint);font-size:12.5px}
  .foot code{font-family:var(--mono);color:var(--ink-dim)}

  @media (max-width:820px){
    .shell{grid-template-columns:1fr}
    .rail{flex-direction:row;align-items:center;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto;gap:14px;padding:12px}
    nav{flex-direction:row}
    .navitem span{display:none}
    .rail-foot{display:none}
    main{padding:26px 16px 40px}
    h1{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .tl-row{opacity:1;transform:none}
  }
.timeline .tl-row{grid-template-columns:1fr;gap:3px}.timeline pre{max-height:260px;overflow:auto;font:12px var(--mono);color:var(--ink-dim)}#extras pre{max-height:420px;overflow:auto}textarea.ask{resize:vertical;color:var(--ink)}button:disabled{opacity:.45;cursor:not-allowed}</style>
</head>
<body><div class="shell">
<aside class="rail"><div class="brand"><span class="wordmark">ORBIT</span></div><nav><span class="navitem" aria-current="true">Agent</span><button disabled class="btn">Memory — coming later</button><button disabled class="btn">GitHub — coming later</button><button disabled class="btn">Skills — coming later</button></nav></aside>
<div class="stage"><header class="topbar"><span id="workspace"></span><span class="pill proto">Local core preview · no OS sandbox</span></header>
<main><h1>What are we working on?</h1><p>Your computer, understood.</p>
<label for="request">Ask ORBIT</label><textarea id="request" class="ask" rows="3">Find and fix the failing test in this project.</textarea>
<p><button id="start" class="btn primary">Ask ORBIT</button> <button id="stop" class="btn danger">Stop Agent</button> <button id="configure" class="btn">Configure AI</button></p>
<p id="status" role="status"></p><details><summary>Undo changes</summary><p><label for="undoId">Task ID (also works after restart)</label><input id="undoId" class="ask"><button id="undo" class="btn">Undo Task</button></p></details><div id="extras" aria-live="polite"></div><div class="section-head"><h2>Agent Timeline</h2></div><div id="timeline" class="timeline" aria-live="polite"></div>

</main><footer class="foot">Real provider calls, permission-gated tools and persistent audit/undo. Terminal processes have the current OS user's privileges.</footer></div></div><script src="/client.js" defer></script></body></html>
